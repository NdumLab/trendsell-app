name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock
      - name: Fail fast when required settings are missing
        working-directory: backend
        run: |
          if env -u DATABASE_URL -u CORS_ORIGINS APP_ENV=production python -c "from app.settings import Settings; Settings.from_env()" 2>/dev/null; then
            echo "Settings.from_env() accepted a production environment with no DATABASE_URL"; exit 1
          fi
      - run: python -m pytest tests/redesign
        working-directory: backend

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: trendsell-ci
          POSTGRES_USER: trendsell
          POSTGRES_DB: trendsell_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock
      - name: Tenancy, concurrency and migration tests against PostgreSQL
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://trendsell:trendsell-ci@localhost:5432/trendsell_test
        run: python -m pytest tests/redesign -q

  frontend:
    name: Frontend type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e:install
        working-directory: frontend
      - name: Only browser tests are discovered
        working-directory: frontend
        run: |
          set -e
          npm run test:e2e -- --list > /tmp/e2e-list.txt
          cat /tmp/e2e-list.txt
          if grep -qE '\.test\.ts' /tmp/e2e-list.txt; then
            echo "Playwright discovered Vitest files"; exit 1
          fi
          grep -q 'e2e/.*\.spec\.ts' /tmp/e2e-list.txt
      - name: Capture, confirm, decide, watch, quote, export and demo flows
        working-directory: frontend
        env:
          TRENDSELL_E2E_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: frontend/.playwright/
          retention-days: 7

  clean-clone:
    name: Clean clone builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every source file the app imports is tracked
        run: |
          set -e
          for path in frontend/src/lib frontend/src/shared frontend/src/features backend/app contracts; do
            test -n "$(git ls-files "$path")" || { echo "$path is not tracked — check .gitignore"; exit 1; }
          done
          test -z "$(git ls-files '*.env' 'backend/.env' 'frontend/.env')" || { echo "an .env file is tracked"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact frontend dependency lock
        working-directory: frontend
        run: npm ci
      - name: Build the versioned release artifact twice
        run: |
          scripts/build_release_artifact.sh "$RUNNER_TEMP/release-first"
          scripts/build_release_artifact.sh "$RUNNER_TEMP/release-second"
          cmp "$RUNNER_TEMP/release-first/trendsell-${GITHUB_SHA:0:12}.tar.gz" \
              "$RUNNER_TEMP/release-second/trendsell-${GITHUB_SHA:0:12}.tar.gz"
          (cd "$RUNNER_TEMP/release-first" && \
            sha256sum --check "trendsell-${GITHUB_SHA:0:12}.tar.gz.sha256")
      - name: Scan the unpacked artifact without logging credential values
        run: |
          mkdir "$RUNNER_TEMP/release-unpacked"
          tar -xzf "$RUNNER_TEMP/release-first/trendsell-${GITHUB_SHA:0:12}.tar.gz" \
              -C "$RUNNER_TEMP/release-unpacked"
          scripts/scan_secrets.sh --directory "$RUNNER_TEMP/release-unpacked"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import the API from the checkout with runtime dependencies only
        run: |
          pip install -r backend/requirements.lock
          python - <<'EOF'
          import importlib.util, sys
          if importlib.util.find_spec('pytest'):
              sys.exit('runtime install must not carry pytest')
          print('runtime install excludes test-only packages')
          EOF
          cd backend && APP_ENV=test DATABASE_URL=sqlite:// CORS_ORIGINS=http://localhost:3000 \
            python -c "from app.main import create_app; from app.settings import Settings; create_app(Settings.from_env()); print('API imports cleanly')"
      - uses: actions/upload-artifact@v4
        with:
          name: trendsell-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-first/*
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject credential-shaped strings in tracked files and reachable history
        run: scripts/scan_secrets.sh --tracked --history

  dependency-scan:
    name: Dependency and license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit --requirement backend/requirements.lock --strict
      - run: pip-audit --requirement backend/requirements-dev.lock --strict
      - run: pip install -r backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm ci
        working-directory: frontend
      - name: Enforce the dependency-license policy and exact inventory
        run: python scripts/check_dependency_licenses.py --check-report docs/DEPENDENCY_LICENSES.md
